name: kronos
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  fl_chart: ^0.66.0
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  provider: ^6.1.5+1
  device_calendar: ^4.3.1
  google_api_availability: ^5.0.1
  google_sign_in: ^6.2.2
  huawei_account: ^6.14.0+300
  connectivity_plus: ^6.1.0
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/google.png
    - assets/images/huawei.png
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"

flutter_native_splash:
  color: "#A5BBC3"
  image: assets/images/logos.png
  android_12:
    color: "#A5BBC3"
    image: assets/images/logos.png 