name: kronos
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0 # He ajustado esto para mayor compatibilidad, 3.9.2 parece un typo o versión futura

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  fl_chart: ^0.66.0
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# --- AQUÍ ES DONDE OCURRE LA MAGIA ---
flutter:
  uses-material-design: true

  # La sección assets debe estar identada (2 espacios) DENTRO de flutter:
  assets:
    - assets/images/logo.png
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"
